[project]
name = "definitions"
version = "0.1.0"
description = ""
# Upper bound inherited from `erc7730` (1.x declares Requires-Python
# ">=3.12,<3.13"). Drop the `<3.13` only once erc7730 supports 3.13 — until
# then a wider bound just turns a clear message into a dependency-resolution
# failure on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.3,<9",
    "requests>=2.28.2,<3",
    "urllib3>=2.7.0,<3",
    "trezor>=0.20.0,<0.21.0",
    "cryptography>=47",
    "rich>=13.8.0,<14",
    "readchar>=4.2.0,<5",
    # Pins Python to <3.13; see requires-python note above.
    "erc7730>=1.0,<2",
    "isort>=5,<6",
    "black>=24.2",
    "flake8>=7",
    "flake8-requirements>=2.1.0",
    "pytest>=7",
    "pytest-random-order",
]

[tool.isort]
profile = "black"

[tool.uv]
package = false
exclude-newer = "30 days"
exclude-newer-package = { urllib3 = "2026-05-08" }

# Use trezorlib from trezor-firmware main instead of the PyPI release
# needed for the DefinitionPayload magic/version split for the v2 defs.
# TODO: remove once trezor >= 0.20.3 ships
[tool.uv.sources]
trezor = { git = "https://github.com/trezor/trezor-firmware.git", subdirectory = "python", rev = "1bf3c5e4c956eb5d1095a2889f4f95d6c030b2f2" }
