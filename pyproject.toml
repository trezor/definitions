[project]
name = "definitions"
version = "0.1.0"
description = ""
# Upper bound inherited from `erc7730` (1.x declares Requires-Python
# ">=3.12,<3.13"). Drop the `<3.13` only once erc7730 supports 3.13 — until
# then a wider bound just turns a clear message into a dependency-resolution
# failure on 3.13.
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.3,<9",
    "requests>=2.28.2,<3",
    "urllib3>=2.7.0,<3",
    "trezor>=0.20.0,<0.21.0",
    "cryptography>=47",
    "rich>=13.8.0,<14",
    "readchar>=4.2.0,<5",
    # Pins Python to <3.13; see requires-python note above.
    "erc7730>=1.0,<2",
    "ruff>=0.6",
    "flake8>=7",
    "flake8-requirements>=2.1.0",
    "pytest>=7",
    "pytest-random-order",
]

# Ruff replaces `isort` and `black` (import sorting and formatting).
# All other Python style checks are still handled by flake8 -- see
# the `check` target in the Makefile.
# The set of files to lint is not configured here -- the Makefile passes
# it in, so that ruff covers exactly what the other style tools cover.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    # isort
    "I",
    # autoflake (unused imports)
    "F401",
    # PEP 585
    "UP006",  # non-pep585-annotation: typing.Tuple -> tuple, typing.Type -> type, ...
    "UP035",  # deprecated-import: typing.Sequence -> collections.abc.Sequence, ...
    # PEP 604
    "UP007",  # non-pep604-annotation-union: Union[int, str] -> int | str
    "UP045",  # non-pep604-annotation-optional: Optional[str] -> str | None
]

[tool.uv]
package = false
exclude-newer = "30 days"
exclude-newer-package = { urllib3 = "2026-05-08" }
